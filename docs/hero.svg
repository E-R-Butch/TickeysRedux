<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Tickeys Redux preview</title>
  <desc id="desc">A native macOS menu bar app for mechanical keyboard sounds, with sound packs, privacy, and Apple Silicon support.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="0.55" stop-color="#16202a"/>
      <stop offset="1" stop-color="#1f2930"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="970" cy="120" r="160" fill="#243744" opacity="0.55"/>
  <circle cx="170" cy="520" r="190" fill="#26352d" opacity="0.5"/>

  <g transform="translate(86 78)">
    <text x="0" y="0" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="66" font-weight="800">Tickeys Redux</text>
    <text x="0" y="52" fill="#9fb0bd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28">Mechanical keyboard sounds for Apple Silicon Macs</text>
    <text x="0" y="104" fill="#cbd5df" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22">Free, open source, native Rust menu bar app.</text>
    <text x="0" y="136" fill="#cbd5df" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22">No microphone. No telemetry. No cloud.</text>

    <g transform="translate(0 188)">
      <rect x="0" y="0" width="176" height="46" rx="23" fill="url(#accent)"/>
      <text x="88" y="30" text-anchor="middle" fill="#0b1115" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700">Download DMG</text>
      <rect x="198" y="0" width="160" height="46" rx="23" fill="#26323b" stroke="#465765"/>
      <text x="278" y="30" text-anchor="middle" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="650">Build from source</text>
    </g>

    <g transform="translate(0 282)" fill="#cbd5df" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19">
      <text x="0" y="0">arm64 native</text>
      <text x="0" y="38">rodio + CoreAudio</text>
      <text x="0" y="76">classic Tickeys sound packs</text>
      <text x="0" y="114">menu bar controls</text>
    </g>
  </g>

  <g transform="translate(660 88)" filter="url(#shadow)">
    <rect x="0" y="0" width="392" height="448" rx="18" fill="#f7f8fa"/>
    <rect x="0" y="0" width="392" height="54" rx="18" fill="#eef1f4"/>
    <circle cx="28" cy="27" r="7" fill="#ff5f57"/>
    <circle cx="52" cy="27" r="7" fill="#ffbd2e"/>
    <circle cx="76" cy="27" r="7" fill="#28c840"/>
    <text x="196" y="34" text-anchor="middle" fill="#303942" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">Tickeys Redux</text>

    <g transform="translate(34 88)">
      <rect x="0" y="0" width="324" height="52" rx="12" fill="#101820"/>
      <text x="24" y="33" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700">Sound Scheme</text>
      <text x="300" y="33" text-anchor="end" fill="#86efac" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Mechanical</text>

      <rect x="0" y="74" width="324" height="52" rx="12" fill="#e9eef2"/>
      <text x="24" y="107" fill="#27313a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700">Volume</text>
      <rect x="130" y="96" width="164" height="8" rx="4" fill="#c7d0d8"/>
      <rect x="130" y="96" width="112" height="8" rx="4" fill="#37c871"/>
      <circle cx="242" cy="100" r="13" fill="#101820"/>

      <rect x="0" y="148" width="324" height="52" rx="12" fill="#e9eef2"/>
      <text x="24" y="181" fill="#27313a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700">Pitch</text>
      <rect x="130" y="170" width="164" height="8" rx="4" fill="#c7d0d8"/>
      <rect x="130" y="170" width="86" height="8" rx="4" fill="#38bdf8"/>
      <circle cx="216" cy="174" r="13" fill="#101820"/>

      <rect x="0" y="236" width="92" height="54" rx="10" fill="#dbe5ec"/>
      <rect x="108" y="236" width="92" height="54" rx="10" fill="#dbe5ec"/>
      <rect x="216" y="236" width="92" height="54" rx="10" fill="#dbe5ec"/>
      <text x="46" y="270" text-anchor="middle" fill="#27313a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">⌘</text>
      <text x="154" y="270" text-anchor="middle" fill="#27313a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">A</text>
      <text x="262" y="270" text-anchor="middle" fill="#27313a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">↵</text>
    </g>
  </g>
</svg>
