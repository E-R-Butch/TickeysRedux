[package]
name = "tickeys-redux"
version = "1.0.8"
description = "Tickeys Redux — mechanical keyboard sound effects for macOS (arm64 native)"
authors = ["应元东 <ying@yingDev.com>", "Sinclair Liu <@sinclair>"]
edition = "2024"
rust-version = "1.85"

[dependencies]
objc2 = "0.6.0"
objc2-foundation = { version = "0.3.0", default-features = false, features = [
    "std", "NSBundle", "NSGeometry", "NSNotification", "NSObject", "NSString", "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3.0", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSAlert",
    "NSApplication",
    "NSBox",
    "NSButton",
    "NSControl",
    "NSImage",
    "NSImageView",
    "NSMenu",
    "NSMenuItem",
    "NSPopUpButton",
    "NSResponder",
    "NSRunningApplication",
    "NSSlider",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTabView",
    "NSTabViewItem",
    "NSTextField",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
rodio = { version = "0.20.1", default-features = false, features = ["wav"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"

[lib]
name = "tickeys_lib"
path = "src/tickeys.rs"
